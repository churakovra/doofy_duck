services:
  platform:
    environment:
      DEV_AUTH_ENABLED: "false"
      DEV_AUTH_USER_ID: "0"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN_REAL:?set TELEGRAM_BOT_TOKEN_REAL in .env.telegram-test}

  gateway:
    image: doofy-duck-telegram-gateway
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
