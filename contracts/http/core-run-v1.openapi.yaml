openapi: 3.1.0
info:
  title: Doofy Duck Core Run API
  version: 1.0.0
  description: Authoritative run creation, deterministic replay, checkpoint persistence, and completion delivery.
servers:
  - url: http://localhost:8080
security:
  - AccessToken: []
paths:
  /api/v1/runs/progress:
    get:
      operationId: getAccountProgress
      summary: Read the account's authoritative best score
      responses:
        '200':
          description: Verified cross-device account progress
          content:
            application/json:
              schema:
                type: object
                required: [bestScore]
                properties: { bestScore: { type: integer, minimum: 0 } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/runs:
    post:
      operationId: createRun
      summary: Create or recover the account's active run
      responses:
        '201':
          description: New run created; response includes the initial writer token
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '200':
          description: Existing active run recovered without its writer token
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/runs/latest:
    get:
      operationId: getLatestRun
      summary: Read the most recently created account-owned run
      responses:
        '200':
          description: Latest account-owned run snapshot without a writer token
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/current:
    get:
      operationId: getCurrentRun
      responses:
        '200':
          description: Current active or delivery-pending run
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunID'
    get:
      operationId: getRun
      responses:
        '200':
          description: Account-owned run snapshot
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/checkpoints:
    parameters:
      - $ref: '#/components/parameters/RunID'
    post:
      operationId: submitCheckpoint
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRequest' } } }
      responses:
        '200':
          description: Checkpoint durably applied; repeated identical requests return the same snapshot
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Expired' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/runs/{run_id}/takeover:
    parameters:
      - $ref: '#/components/parameters/RunID'
    post:
      operationId: takeOverRun
      responses:
        '200':
          description: Writer generation and token rotated
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/runs/{run_id}/abandon:
    parameters:
      - $ref: '#/components/parameters/RunID'
    post:
      operationId: abandonRun
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AbandonRequest' } } }
      responses:
        '200':
          description: Run abandonment recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/RunSnapshot' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /healthz:
    get:
      security: []
      responses:
        '200': { description: Process is serving requests }
  /readyz:
    get:
      security: []
      responses:
        '200': { description: Database, migrations, and platform delivery are ready }
        '503': { description: Service is not ready }
  /internal/v1/outages/start:
    post:
      security:
        - OperatorToken: []
      operationId: startOutage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startedAt]
              properties: { startedAt: { type: string, format: date-time } }
      responses:
        '201': { description: Outage start persisted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/v1/outages/{id}/recover:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      security:
        - OperatorToken: []
      operationId: recoverOutage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveredAt]
              properties: { recoveredAt: { type: string, format: date-time } }
      responses:
        '200': { description: Outage recovery persisted }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: EdDSA JWT
    OperatorToken:
      type: http
      scheme: bearer
  parameters:
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RunSnapshot:
      type: object
      required: [runId, accountId, lifeIndex, seed, simulationVersion, generatorVersion, configId, state, status, verificationStatus, deliveryStatus, checkpointSequence, writerGeneration, activeTicks, activeTickLimit, submissionDeadline]
      properties:
        runId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        lifeIndex: { type: integer, minimum: 0 }
        seed: { type: integer, minimum: 0, maximum: 4294967295 }
        simulationVersion: { type: string }
        generatorVersion: { type: string }
        configId: { type: string }
        state: { type: object, description: Complete serialized Go simulation state. }
        status: { type: string, enum: [active, completion_pending, completed, rejected, abandoned] }
        verificationStatus: { type: string, enum: [in_progress, verified, rejected] }
        deliveryStatus: { type: string, enum: [not_ready, pending, delivered, rejected] }
        checkpointSequence: { type: integer, minimum: -1 }
        writerGeneration: { type: integer, minimum: 1 }
        activeTicks: { type: integer, minimum: 0, maximum: 216000 }
        activeTickLimit: { type: integer, const: 216000 }
        submissionDeadline: { type: string, format: date-time }
        completionReason: { type: string, enum: [death, flight_cap] }
        writerToken: { type: string, description: Present on initial creation and explicit takeover only. }
    CheckpointRequest:
      type: object
      additionalProperties: false
      required: [checkpointSequence, writerGeneration, writerToken, idempotencyKey, ticks]
      properties:
        checkpointSequence: { type: integer, minimum: 0 }
        writerGeneration: { type: integer, minimum: 1 }
        writerToken: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
        ticks:
          type: array
          minItems: 1
          maxItems: 120
          items:
            type: array
            maxItems: 1
            items:
              type: object
              additionalProperties: false
              required: [sequence, action]
              properties:
                sequence: { type: integer, minimum: 0 }
                action: { type: string, const: FLAP }
    AbandonRequest:
      type: object
      additionalProperties: false
      required: [writerGeneration, writerToken]
      properties:
        writerGeneration: { type: integer, minimum: 1 }
        writerToken: { type: string, minLength: 1 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    InvalidRequest:
      description: Invalid JSON or replay payload
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooLarge:
      description: Request body exceeds the configured limit
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Expired:
      description: Submission window expired and run was definitively rejected
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Checkpoint conflict, writer fencing, run lifecycle conflict, or pending completion
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Run does not exist for this account
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid authentication
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: In-flight request limit reached; retry after the integer seconds in Retry-After
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
