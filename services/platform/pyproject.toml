[project]
name = "doofy-duck-platform"
version = "0.1.0"
description = "Doofy Duck Platform and Economy API"
requires-python = ">=3.15,<3.16"
dependencies = [
  "alembic==1.16.5",
  "cryptography==46.0.1",
  "fastapi==0.120.0",
  "psycopg==3.3.2",
  "pydantic==2.14.1",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "jsonschema==4.25.1", "mypy==1.18.2", "pytest==8.4.2", "ruff==0.13.2"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.15"
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
