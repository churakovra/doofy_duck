name: web-and-simulation-checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Run optional production and development browser tests
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.11.1
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/core/simulation/go.mod
          cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:go:race
      - run: go -C services/core/simulation vet ./...
      - if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        run: npm run check:browser

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://platform:platform@127.0.0.1:5432/platform_test
      ECONOMY_TEST_DATABASE_URL: postgresql+psycopg://economy:economy@127.0.0.1:5432/economy_test
      CORE_TEST_DATABASE_URL: postgres://core:core@127.0.0.1:5432/core_test?sslmode=disable
      CORE_TEST_PYTHON: ${{ github.workspace }}/services/platform/.venv/bin/python
      CORE_REQUIRE_PYTHON_INTEROP: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.11.1
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/core/backend/go.mod
          cache-dependency-path: services/core/backend/go.sum
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq5
      - run: python3 -m pip install --user uv==0.13.1
      - run: uv python install 3.15.0
      - name: Create isolated PostgreSQL test databases
        run: |
          pg_container_id="$(docker ps -q --filter ancestor=postgres:18.0 | head -n 1)"
          docker exec "$pg_container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE platform LOGIN PASSWORD 'platform'"
          docker exec "$pg_container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE platform_test OWNER platform"
          docker exec "$pg_container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE economy LOGIN PASSWORD 'economy'"
          docker exec "$pg_container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE economy_test OWNER economy"
          docker exec "$pg_container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE core LOGIN PASSWORD 'core'"
          docker exec "$pg_container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE core_test OWNER core"
      - run: npm run check:backend:integration
