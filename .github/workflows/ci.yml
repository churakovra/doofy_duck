name: web-and-simulation-checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Run optional production and development browser tests
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/core/simulation/go.mod
          cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:go:race
      - run: go -C services/core/simulation vet ./...
      - if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        run: npm run check:browser
